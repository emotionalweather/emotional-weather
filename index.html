<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Emotional Weather - الطقس العاطفي</title>

<!-- GoatCounter -->
<script data-goatcounter="https://emotionalweather.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   🎨 Reset & Base
   ============================================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-deep: #05080f;
    --bg-mid: #0a0f1a;
    --glass-bg: rgba(15, 23, 42, 0.55);
    --glass-border: rgba(148, 163, 184, 0.15);
    --glass-hover: rgba(30, 41, 59, 0.7);
    --accent-cyan: #38bdf8;
    --accent-violet: #8b5cf6;
    --accent-pink: #ec4899;
    --accent-gold: #fbbf24;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --shadow-glow: 0 0 40px rgba(56, 189, 248, 0.15);
    --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.5);
    --font-ar: 'Tajawal', 'Segoe UI', sans-serif;
    --font-en: 'Space Grotesk', 'Segoe UI', sans-serif;
}

html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
}

body {
    font-family: var(--font-ar);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    user-select: none;
    position: relative;
}

/* ============================================================
   ✨ الخلفية السينمائية (Gradient animations)
   ============================================================ */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 20%, rgba(255, 34, 0, 0.12), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.1), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(139, 92, 246, 0.12), transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(0, 255, 150, 0.08), transparent 45%);
    z-index: 0;
    pointer-events: none;
    animation: bgShift 30s ease-in-out infinite;
}

@keyframes bgShift {
    0%, 100% { opacity: 0.85; transform: scale(1) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(3deg); }
}

/* نجوم متلألئة */
body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 80% 40%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 90% 90%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.5), transparent);
    background-size: 550px 550px, 350px 350px, 250px 250px, 400px 400px, 300px 300px, 200px 200px;
    background-position: 0 0, 40px 60px, 130px 270px, 70px 100px, 20px 30px, 90px 150px;
    z-index: 0;
    pointer-events: none;
    animation: starTwinkle 8s ease-in-out infinite;
    opacity: 0.7;
}

@keyframes starTwinkle {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
}

/* ============================================================
   🗺️ الخريطة
   ============================================================ */
#map {
    flex: 1;
    z-index: 1;
    background: transparent;
}

.leaflet-container {
    background: transparent !important;
    font-family: var(--font-ar) !important;
}

.leaflet-control-attribution {
    background: rgba(10, 15, 25, 0.6) !important;
    color: var(--text-muted) !important;
    font-size: 9px !important;
    backdrop-filter: blur(8px);
    border-radius: 6px 0 0 0;
}

.leaflet-control-attribution a { color: var(--accent-cyan) !important; }

.leaflet-bar {
    border: none !important;
    box-shadow: var(--shadow-soft) !important;
}

.leaflet-bar a {
    background: var(--glass-bg) !important;
    backdrop-filter: blur(20px);
    color: var(--accent-cyan) !important;
    border-color: var(--glass-border) !important;
    transition: all 0.3s ease !important;
}

.leaflet-bar a:hover {
    background: var(--glass-hover) !important;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
}

/* ============================================================
   🎯 الهيدر
   ============================================================ */
#header {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 20px 12px;
    text-align: center;
    z-index: 1000;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(5,8,15,0.85) 0%, transparent 100%);
}

#header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, #FF2200 0%, #FFB800 40%, #00ff96 70%, #00CED1 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
    animation: titleShine 4s linear infinite;
    text-shadow: 0 0 40px rgba(255, 100, 50, 0.4);
}

@keyframes titleShine {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
}

#header p {
    font-size: 0.72rem;
    color: var(--text-secondary);
    margin-top: 4px;
    letter-spacing: 0.5px;
    font-weight: 400;
}

/* ============================================================
   🎛️ الشريط العلوي (Glassmorphism)
   ============================================================ */
#top-bar {
    position: absolute;
    top: 78px; left: 16px; right: 16px;
    z-index: 1000;
    display: flex;
    gap: 10px;
    align-items: center;
    pointer-events: none;
}

#top-bar > * { pointer-events: auto; }

.search-box { flex: 1; position: relative; }

.search-box input {
    width: 100%;
    padding: 13px 44px 13px 18px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    color: var(--text-primary);
    font-size: 0.88rem;
    font-family: inherit;
    outline: none;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: var(--shadow-soft);
    transition: all 0.3s ease;
}

.search-box input::placeholder { color: var(--text-muted); }

.search-box input:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15), 0 0 30px rgba(56, 189, 248, 0.25);
    background: rgba(15, 23, 42, 0.75);
}

.search-box .search-icon {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 1rem;
    pointer-events: none;
    transition: color 0.3s;
}

.search-box input:focus + .search-icon { color: var(--accent-cyan); }

.search-results {
    position: absolute;
    top: 100%; left: 0; right: 0;
    margin-top: 8px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    max-height: 280px;
    overflow-y: auto;
    display: none;
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    animation: dropIn 0.3s ease;
}

@keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.search-results.show { display: block; }

.search-result-item {
    padding: 12px 16px;
    font-size: 0.82rem;
    cursor: pointer;
    border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    color: var(--text-primary);
    transition: all 0.2s;
}

.search-result-item:hover {
    background: rgba(56, 189, 248, 0.08);
    padding-right: 22px;
}

.search-result-item:last-child { border-bottom: none; }

/* ============================================================
   👁️ زر الخصوصية (Glassmorphism)
   ============================================================ */
#privacy-btn {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--accent-cyan);
    font-size: 1.15rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: var(--shadow-soft);
    flex-shrink: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: inherit;
}

#privacy-btn:hover {
    transform: translateY(-2px);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.35), var(--shadow-soft);
}

#privacy-btn:active { transform: translateY(0) scale(0.95); }

#privacy-btn.private {
    color: var(--accent-gold);
    border-color: var(--accent-gold);
    box-shadow: 0 0 25px rgba(251, 191, 36, 0.35), var(--shadow-soft);
}

/* ============================================================
   📊 إخفاء شريط المشاعر
   ============================================================ */
#emotions { display: none !important; }

/* ============================================================
   💬 نافذة الإرسال (Glassmorphism)
   ============================================================ */
#send-modal {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.75);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

#send-modal.show {
    display: flex;
    animation: modalIn 0.3s ease;
}

@keyframes modalIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-card {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 28px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 80px rgba(56, 189, 248, 0.1);
    animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes cardPop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.modal-card h3 {
    color: var(--accent-cyan);
    margin-bottom: 12px;
    font-size: 1.2rem;
    font-weight: 700;
}

.modal-card .target-name {
    color: var(--text-primary);
    font-size: 0.95rem;
    margin-bottom: 20px;
    word-break: break-word;
}

.modal-card .emotions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
    max-height: 400px;
    overflow-y: auto;
    padding: 4px;
}

.modal-card .modal-emo {
    padding: 14px 6px;
    border: 1px solid;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(10px);
}

.modal-card .modal-emo:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.modal-card .modal-emo .emo-icon { font-size: 1.6rem; }

.modal-card .cancel-btn {
    width: 100%;
    padding: 13px;
    background: rgba(255, 100, 100, 0.1);
    border: 1px solid rgba(255, 100, 100, 0.35);
    color: #ff8080;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    transition: all 0.25s;
}

.modal-card .cancel-btn:hover {
    background: rgba(255, 100, 100, 0.2);
    transform: translateY(-1px);
}

/* ============================================================
   🔔 الإشعار (Toast)
   ============================================================ */
#toast {
    position: fixed;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: rgba(15, 23, 42, 0.92);
    padding: 14px 28px;
    border-radius: 40px;
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 3000;
    font-size: 0.88rem;
    max-width: 90%;
    text-align: center;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.15);
    font-weight: 500;
}

#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ============================================================
   🎭 نقاط المشاعر على الخريطة
   ============================================================ */
.emo-marker { background: transparent !important; border: none !important; }

.emo-marker-inner {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: markerFloat 3s ease-in-out infinite;
}

@keyframes markerFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

.emo-marker-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.4;
    animation: pulseGlow 2s infinite ease-out;
    filter: blur(4px);
}

@keyframes pulseGlow {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(2.4); opacity: 0; }
}

.emo-marker-emoji {
    font-size: 20px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 6px currentColor);
}

.user-marker { background: transparent !important; border: none !important; }

.user-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
        0 0 0 4px rgba(56, 189, 248, 0.6),
        0 0 20px rgba(56, 189, 248, 0.9),
        0 0 40px rgba(56, 189, 248, 0.5);
    animation: userPulse 2s infinite;
}

@keyframes userPulse {
    0%, 100% {
        box-shadow: 0 0 0 4px rgba(56,189,248,0.6), 0 0 20px rgba(56,189,248,0.9), 0 0 40px rgba(56,189,248,0.5);
    }
    50% {
        box-shadow: 0 0 0 10px rgba(56,189,248,0.2), 0 0 30px rgba(56,189,248,1), 0 0 60px rgba(56,189,248,0.7);
    }
}

/* ============================================================
   📱 للجوال
   ============================================================ */
@media (max-width: 768px) {
    #header h1 { font-size: 1.25rem; }
    #header p { font-size: 0.65rem; }
    #top-bar { top: 68px; left: 12px; right: 12px; }
    .search-box input { font-size: 0.82rem; padding: 11px 40px 11px 14px; }
    #privacy-btn { width: 42px; height: 42px; font-size: 1rem; }
    #toast { bottom: 160px; font-size: 0.82rem; padding: 12px 22px; }
}

@media (max-width: 500px) {
    #header h1 { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div id="header">
    <h1>الطقس العاطفي</h1>
    <p>نبض مشاعر العالم في اللحظة هذه</p>
</div>

<div id="top-bar">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن مدينة، حي، أو شارع..." autocomplete="off">
        <span class="search-icon">🔍</span>
        <div class="search-results" id="searchResults"></div>
    </div>
    <button id="privacy-btn" onclick="togglePrivacy()" title="الخصوصية">👁️</button>
</div>

<div id="map"></div>
<div id="emotions"></div>

<div id="send-modal">
    <div class="modal-card">
        <h3>أرسل مشعرك إلى</h3>
        <div class="target-name" id="targetName"></div>
        <div class="emotions-grid" id="modalEmotions"></div>
        <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<div id="toast"></div>

<script>
if (typeof L === 'undefined') {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ff8080;font-size:18px;">❌ فشل تحميل مكتبة الخرائط.</div>';
    throw new Error('Leaflet not loaded');
}

// ============================================================
//  🎭 المشاعر
// ============================================================
const EMOTIONS = {
    joy:         { name: 'فرح',      color: '#FFD700', emoji: '😊' },
    sad:         { name: 'حزن',      color: '#4A90E2', emoji: '😢' },
    angry:       { name: 'غضب',      color: '#FF4500', emoji: '😠' },
    calm:        { name: 'هدوء',     color: '#00CED1', emoji: '😌' },
    anxious:     { name: 'قلق',      color: '#8A2BE2', emoji: '😰' },
    grateful:    { name: 'امتنان',   color: '#FF69B4', emoji: '🙏' },
    love:        { name: 'حب',       color: '#FF1493', emoji: '❤️' },
    fear:        { name: 'خوف',      color: '#6A0DAD', emoji: '😨' },
    hope:        { name: 'أمل',      color: '#FFA500', emoji: '🌟' },
    frustration: { name: 'إحباط',    color: '#B22222', emoji: '😤' },
    surprise:    { name: 'دهشة',     color: '#FFB300', emoji: '😲' },
    bored:       { name: 'ملل',      color: '#696969', emoji: '😒' },
    proud:       { name: 'فخر',      color: '#9370DB', emoji: '😎' },
    shy:         { name: 'خجل',      color: '#FFB6C1', emoji: '😳' },
    excited:     { name: 'حماس',     color: '#FF4500', emoji: '🤩' },
    lonely:      { name: 'وحدة',     color: '#483D8B', emoji: '🥺' },
    relief:      { name: 'ارتياح',   color: '#00FA9A', emoji: '😮‍💨' },
    guilty:      { name: 'ذنب',      color: '#8B4513', emoji: '😔' },
    longing:     { name: 'شوق',      color: '#DA70D6', emoji: '🥹' },
    curious:     { name: 'فضول',     color: '#20B2AA', emoji: '🤔' },
    thoughtful:  { name: 'تأمل',     color: '#708090', emoji: '🤨' },
    confused:    { name: 'حيرة',     color: '#B8860B', emoji: '😕' },
    nostalgic:   { name: 'حنين',     color: '#CD853F', emoji: '😌' },
    inspired:    { name: 'إلهام',    color: '#FF69B4', emoji: '✨' },
    neutral:     { name: 'محايد',    color: '#94a3b8', emoji: '😐' },
    tired:       { name: 'متعب',     color: '#64748b', emoji: '😴' },
    sick:        { name: 'مريض',     color: '#7F1D1D', emoji: '🤒' },
    stressed:    { name: 'توتر',     color: '#DC2626', emoji: '😖' },
    peaceful:    { name: 'سلام',     color: '#0EA5E9', emoji: '🕊️' },
    overwhelmed: { name: 'إنهاك',    color: '#5B21B6', emoji: '😵' },
    determined:  { name: 'عزيمة',    color: '#059669', emoji: '💪' },
    playful:     { name: 'مرح',      color: '#F59E0B', emoji: '🤪' },
    disgusted:   { name: 'اشمئزاز',  color: '#65A30D', emoji: '🤢' },
    awed:        { name: 'انبهار',   color: '#8B5CF6', emoji: '🤯' },
    sympathetic: { name: 'تعاطف',    color: '#EC4899', emoji: '🤗' }
};

// ============================================================
//  🗺️ الخريطة
// ============================================================
const map = L.map('map', {
    center: [25, 45],
    zoom: 3,
    zoomControl: true,
    worldCopyJump: true,
    minZoom: 2,
    maxZoom: 18,
    zoomAnimation: true,
    fadeAnimation: true,
    markerZoomAnimation: true
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri &copy; OpenStreetMap',
    maxZoom: 16
}).addTo(map);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    pane: 'overlayPane'
}).addTo(map);

// ============================================================
//  💾 المتغيرات
// ============================================================
let userLocation = null;
let userMarker = null;
let userCircle = null;
let isPrivateMode = false;
let selectedEmotion = null;
let pendingTarget = null;
const activeMarkers = {};
let markerIdCounter = 0;

// ============================================================
//  🎭 بناء الأزرار
// ============================================================
function buildEmotionButtons() {
    const container = document.getElementById('emotions');
    Object.entries(EMOTIONS).forEach(([key, emo]) => {
        const btn = document.createElement('button');
        btn.className = 'emo-btn';
        btn.dataset.key = key;
        btn.style.borderColor = emo.color;
        btn.style.color = emo.color;
        btn.innerHTML = `<span class="emo-icon">${emo.emoji}</span><span>${emo.name}</span>`;
        btn.onclick = () => onEmotionButtonClick(key);
        container.appendChild(btn);
    });
}

function buildModalEmotions() {
    const container = document.getElementById('modalEmotions');
    Object.entries(EMOTIONS).forEach(([key, emo]) => {
        const btn = document.createElement('button');
        btn.className = 'modal-emo';
        btn.style.borderColor = emo.color;
        btn.style.color = emo.color;
        btn.innerHTML = `<span class="emo-icon">${emo.emoji}</span><span>${emo.name}</span>`;
        btn.onclick = () => sendEmotionToTarget(key);
        container.appendChild(btn);
    });
}

// ============================================================
//  🎯 عند اختيار مشعر
// ============================================================
function onEmotionButtonClick(key) {
    selectedEmotion = key;
    document.querySelectorAll('.emo-btn').forEach(b => b.classList.remove('active'));
    const targetBtn = document.querySelector(`.emo-btn[data-key="${key}"]`);
    if (targetBtn) targetBtn.classList.add('active');

    if (!userLocation) {
        showToast('⏳ جاري تحديد موقعك...');
        return;
    }
    const target = isPrivateMode ? 'حيّك' : 'موقعك';
    const jitter = isPrivateMode ? 0.02 : 0.0005;
    const lat = userLocation.lat + (Math.random() - 0.5) * jitter;
    const lng = userLocation.lng + (Math.random() - 0.5) * jitter;
    dropEmotion(lat, lng, key, `📍 ${target}`);
}

// ============================================================
//  📍 إسقاط مشعر
// ============================================================
function dropEmotion(lat, lng, emotionKey, label) {
    const emo = EMOTIONS[emotionKey];
    if (!emo) return;

    const id = 'm_' + (++markerIdCounter);

    const icon = L.divIcon({
        className: 'emo-marker',
        html: `<div class="emo-marker-inner" style="color:${emo.color};">
                 <span class="emo-marker-emoji">${emo.emoji}</span>
               </div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19]
    });

    const marker = L.marker([lat, lng], { icon, interactive: false }).addTo(map);
    const timeout = setTimeout(() => {
        map.removeLayer(marker);
        delete activeMarkers[id];
    }, 25000);

    activeMarkers[id] = { marker, timeout };
    showToast(`${emo.emoji} ${label}`);
}

// ============================================================
//  🪟 نافذة الإرسال
// ============================================================
function openSendModal(lat, lng, name) {
    pendingTarget = { lat, lng, name };
    document.getElementById('targetName').textContent = '📍 ' + name;
    document.getElementById('send-modal').classList.add('show');
}

function closeModal() {
    document.getElementById('send-modal').classList.remove('show');
    pendingTarget = null;
}

function sendEmotionToTarget(emotionKey) {
    if (!pendingTarget) return;
    dropEmotion(pendingTarget.lat, pendingTarget.lng, emotionKey, pendingTarget.name);
    closeModal();
}

// ============================================================
//  🗺️ الضغط على الخريطة
// ============================================================
map.on('click', async (e) => {
    const { lat, lng } = e.latlng;
    showToast('⏳ جاري تحديد المكان...');
    try {
        const name = await reverseGeocode(lat, lng);
        openSendModal(lat, lng, name);
    } catch {
        openSendModal(lat, lng, `${lat.toFixed(3)}, ${lng.toFixed(3)}`);
    }
});

async function reverseGeocode(lat, lng) {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    const a = data.address || {};
    return a.city || a.town || a.village || a.county || a.state || a.country || data.display_name || `${lat.toFixed(3)}, ${lng.toFixed(3)}`;
}

// ============================================================
//  🔍 البحث
// ============================================================
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchTimeout;

searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = searchInput.value.trim();
    if (q.length < 2) { searchResults.classList.remove('show'); return; }
    searchTimeout = setTimeout(() => performSearch(q), 500);
});

searchInput.addEventListener('blur', () => {
    setTimeout(() => searchResults.classList.remove('show'), 250);
});

async function performSearch(query) {
    try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8&accept-language=ar`;
        const res = await fetch(url);
        const data = await res.json();
        renderSearchResults(data);
    } catch (err) { console.error(err); }
}

function renderSearchResults(items) {
    searchResults.innerHTML = '';
    if (!items || items.length === 0) {
        searchResults.innerHTML = '<div class="search-result-item">لا توجد نتائج</div>';
        searchResults.classList.add('show');
        return;
    }
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        div.textContent = '📍 ' + item.display_name;
        div.onclick = () => {
            const lat = parseFloat(item.lat);
            const lng = parseFloat(item.lon);
            const shortName = item.name || item.display_name.split(',')[0];
            map.setView([lat, lng], 12, { animate: true });
            searchInput.value = '';
            searchResults.classList.remove('show');
            setTimeout(() => openSendModal(lat, lng, shortName), 700);
        };
        searchResults.appendChild(div);
    });
    searchResults.classList.add('show');
}

// ============================================================
//  📍 موقع المستخدم
// ============================================================
function initUserLocation() {
    if (!navigator.geolocation) {
        showToast('⚠️ المتصفح لا يدعم تحديد الموقع');
        return;
    }
    navigator.geolocation.getCurrentPosition(
        pos => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            drawUserMarker();
            map.setView([userLocation.lat, userLocation.lng], 12, { animate: true });
            showToast('📍 تم تحديد موقعك');
        },
        err => {
            console.warn('Geolocation failed', err);
            showToast('⚠️ تعذر تحديد موقعك');
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
    );
}

function drawUserMarker() {
    if (!userLocation) return;
    if (userMarker) map.removeLayer(userMarker);
    if (userCircle) map.removeLayer(userCircle);

    const icon = L.divIcon({
        className: 'user-marker',
        html: '<div class="user-dot"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
    });

    if (isPrivateMode) {
        userCircle = L.circle([userLocation.lat, userLocation.lng], {
            radius: 2000,
            color: '#FFD700',
            weight: 1,
            fillColor: '#FFD700',
            fillOpacity: 0.1,
            dashArray: '5, 5'
        }).addTo(map);
    }
    userMarker = L.marker([userLocation.lat, userLocation.lng], { icon }).addTo(map);
}

// ============================================================
//  👁️ زر الخصوصية
// ============================================================
function togglePrivacy() {
    isPrivateMode = !isPrivateMode;
    const btn = document.getElementById('privacy-btn');
    btn.classList.toggle('private', isPrivateMode);
    btn.textContent = isPrivateMode ? '🙈' : '👁️';
    drawUserMarker();
    showToast(isPrivateMode ? '🔒 وضع الخصوصية: يظهر الحي فقط' : '👁️ وضع دقيق: يظهر موقعك بالضبط');
}

// ============================================================
//  🔔 Toast
// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ============================================================
//  🚀 التشغيل
// ============================================================
buildEmotionButtons();
buildModalEmotions();
initUserLocation();
map.on('contextmenu', e => e.originalEvent.preventDefault());
</script>
